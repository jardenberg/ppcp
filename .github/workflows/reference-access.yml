name: Probe public reference access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/check_reference_access.py
      - .github/workflows/reference-access.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test DNS, HTML, Markdown and real MCP retrieval
        run: python3 tools/check_reference_access.py
